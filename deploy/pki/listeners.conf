# Listener → certificate table, consumed by scripts/gen-pki.sh.
#
# Format:  name|kind|san-list
#
#   name      Base filename under .secrets/pki/ (<name>.pem / <name>.key).
#   kind      `server` → extendedKeyUsage=serverAuth, SAN list required.
#             `client` → extendedKeyUsage=clientAuth, SAN list must be empty.
#   san-list  Comma-separated openssl SAN entries. `${DOMO_HOST}` and
#             `${DOMO_LAN_IP}` are expanded by the script at issuance time.
#
# AXIAM cannot issue certificates carrying SANs, so every *server* certificate
# here is signed offline by the same organization root that AXIAM later imports
# (BYOK). That keeps the single-trust-anchor rule intact: one root, no second CA.
#
# `axiam-amqp-client` is the documented PKI-03 exception (D-37 / C-4): AXIAM must
# present a client certificate to RabbitMQ before AXIAM exists to issue one, so
# this one client leaf is also root-signed offline. Every *other* client
# certificate in the demo is issued by AXIAM from a tenant signing CA.

axiam-server|server|DNS:axiam-server,DNS:localhost,DNS:${DOMO_HOST},DNS:axiam.${DOMO_HOST},IP:127.0.0.1,IP:${DOMO_LAN_IP}
rabbitmq|server|DNS:rabbitmq,DNS:localhost,DNS:${DOMO_HOST},IP:127.0.0.1,IP:${DOMO_LAN_IP}
device-twin|server|DNS:device-twin,DNS:localhost,IP:127.0.0.1
axiam-amqp-client|client|
