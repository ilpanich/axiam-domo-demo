# PostgreSQL 17 — TLS posture and the Pi memory budget.
#
# This file is the server's ENTIRE configuration: deploy/compose.yml starts the
# container with `-c config_file=/etc/postgresql/postgresql.tls.conf`. Anything
# not set here keeps PostgreSQL's compiled-in default, which is what we want for
# every setting the demo has no opinion about.
#
# Because the configuration file lives OUTSIDE the data directory, two paths
# that normally default relative to it must be stated explicitly — see the
# "authentication files" section at the bottom. Leaving them out is the one way
# this file fails, and it fails at startup with a "could not open" that points
# at /etc/postgresql rather than at the real cause.
#
# Version 17, not 18, and that is a deliberate pin rather than staleness:
# Spring Boot 4's Flyway starter has an open, unresolved incompatibility with
# PostgreSQL 18 (spring-projects/spring-boot#49012, "Unsupported Database:
# PostgreSQL 18.1"). Phase 2's Management Platform is a Spring Boot 4.1 service
# and would walk straight into it. Revisit when that issue closes.

# --- connections -------------------------------------------------------------

# The container network only. D-05: nothing but 443, 8090 and 8883 leaves the
# Docker network, and this service publishes no port at all — `listen_addresses`
# is about which interfaces INSIDE the container accept connections, and the
# Management Platform (Phase 2) and Device Twin (Phase 3) reach it by service
# name over the compose bridge.
listen_addresses = '*'
port = 5432

# Two application pools sized 5-10 each (HikariCP for the Java service, sqlx's
# pool for the Rust one), plus headroom for a psql session during the demo.
# PostgreSQL's default of 100 reserves per-connection memory this machine has
# better uses for. Raise it only alongside work_mem, never on its own.
max_connections = 40

# --- TLS (D-07: 1.3 only, on every listener this project configures) ---------

# Published into postgres-tls by the `tls-init` one-shot in deploy/compose.yml,
# owned by uid 70 at 0600. PostgreSQL refuses to start if the key is group- or
# world-readable, and Compose outside swarm ignores `secrets.*.uid/mode`, which
# is exactly why the copy-into-a-volume pattern exists (P-6).
ssl = on
ssl_cert_file = '/etc/postgresql/tls/server.pem'
ssl_key_file = '/etc/postgresql/tls/server.key'

# The organization root. Clients are not required to present a certificate in
# Phase 1 — device and service mTLS terminates at AXIAM and the broker, not here
# — but naming the root means the server can verify one the moment a later phase
# decides to require it, with no second trust anchor introduced.
ssl_ca_file = '/etc/postgresql/tls/root.pem'

# D-07. Only the minimum is pinned: 1.3 is the highest version this server
# speaks, so a max would be redundant today and wrong the day it is not.
ssl_min_protocol_version = 'TLSv1.3'

# --- memory: sized for a SHARED 4 GB budget, not for throughput --------------
#
# Every number below comes from .claude/CLAUDE.md's "PostgreSQL version and Pi
# tuning" section. They are "good enough for a two-schema, low-concurrency demo"
# values. Recording that here on purpose: a later reader who assumes they were
# measured will be reluctant to change them, and they should not be.

# The usual 25%-of-RAM rule assumes PostgreSQL owns the machine. Here it shares
# an 8 GB Pi 5 with AXIAM's own SurrealDB, RabbitMQ and axiam-server, plus a
# JVM, the Twin and Caddy, inside a 4 GB total budget. 160MB sits in the middle
# of the 128-192MB band that budget allows.
shared_buffers = 160MB

# Deliberately low. The risk at this scale is max_connections x work_mem under
# memory pressure, not single-query speed: the whole dataset is a few hundred
# rows across sites, buildings, apartments, devices and grants, plus 114 device
# shadows. 40 x 4MB is a bounded worst case; 40 x 64MB would not be.
work_mem = 4MB

# A planner hint that allocates nothing. Set conservatively because the OS page
# cache does NOT have the Pi's whole 8 GB to itself here — the same 4 GB budget
# above is shared with AXIAM's stack.
effective_cache_size = 768MB

# --- authentication files ----------------------------------------------------
#
# Required, not optional. These default to the directory containing THIS file,
# and this file is not in the data directory. The official image's entrypoint
# writes and maintains both inside PGDATA (it appends the host rule that lets
# the other containers connect), so pointing at them there is what keeps the
# image's own behaviour intact.
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

# --- logging -----------------------------------------------------------------

# Timestamped, with the connecting user and database, so a Phase 2 or Phase 3
# connection failure is diagnosable from `docker compose logs postgres` alone.
log_timezone = 'UTC'
timezone = 'UTC'
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
