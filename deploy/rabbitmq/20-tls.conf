# RabbitMQ broker-wide TLS — installed as /etc/rabbitmq/conf.d/20-tls.conf.
#
# This is a *fragment*, not a replacement for rabbitmq.conf. The official
# image's entrypoint writes conf.d/10-defaultuser.conf from
# RABBITMQ_DEFAULT_USER/PASS; replacing rabbitmq.conf wholesale loses the
# credentials AXIAM authenticates with (D-26: AXIAM's `/` vhost and its
# entrypoint-created default user must survive untouched). Numbered 20 so it
# loads after that one.
#
# # Why sysctl format and not RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
#
# The erl-args form is a different language. `-rabbit <key> <value>` wants
# Erlang atoms and terms (`tcp_listeners`, `ssl_listeners`, `ssl_options`), not
# dotted sysctl config keys, and the two spellings are not interchangeable. Pass
# sysctl keys as erl-args and the node dies during prelaunch with
#
#     Error when reading /var/lib/rabbitmq/.erlang.cookie: eacces
#
# which reads as a permissions or bind-mount problem rather than a config one.
# In AXIAM's own history that mis-diagnosis cost three CI rounds. The sysctl
# format below is the documented one and has no quoting hazards.
#
# # Why this file is a merged copy rather than an override fragment
#
# RESEARCH A4 assumed a later conf.d fragment overrides `ssl_options.verify` set
# by an earlier one. Rather than depend on lexical-order override semantics for
# a security-critical value, this plan ships one merged file that states the
# final value directly. `rabbitmq-diagnostics environment` still confirms what
# the node actually loaded.

listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/tls/root.pem
ssl_options.certfile   = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile    = /etc/rabbitmq/tls/server.key

# Broker-wide peer verification. Unlike AXIAM's own test broker (verify_none),
# this demo requires every AMQP and MQTT client to present a certificate that
# chains to the one organization root.
#
# T-01-06: this setting also applies to AXIAM's own AMQPS link on 5671. AXIAM
# therefore MUST present a client certificate, which is why the offline PKI
# issues `axiam-amqp-client` and compose sets both
# AXIAM__AMQP__TLS__CLIENT_CERT_PATH and CLIENT_KEY_PATH from first boot
# (D-37 / C-4). Setting only one of the two fails closed.
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true

# root -> tenant signing CA -> device leaf is a three-link chain.
ssl_options.depth = 3

# TLS 1.3 only, matching the project floor for all external communication.
ssl_options.versions.1 = tlsv1.3
