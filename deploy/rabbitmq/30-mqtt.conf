# MQTT listener + HTTP authorization backend — /etc/rabbitmq/conf.d/30-mqtt.conf.
#
# Only MQTT-specific keys live here. The broker-wide TLS values (verify_peer,
# fail_if_no_peer_cert, versions, depth, cacertfile) are set once in
# 20-tls.conf and deliberately NOT restated, so there is exactly one place
# where peer verification is defined.

mqtt.listeners.tcp = none
mqtt.listeners.ssl.default = 8883

# No anonymous CONNECT. Identity is proven twice: by the TLS client
# certificate at the transport layer, and by the AXIAM JWT carried as the
# MQTT password and checked by the Device Twin.
mqtt.allow_anonymous = false
mqtt.vhost = domo
mqtt.exchange = amq.topic

# T-01-01, hop 2 of the identity chain. The broker derives the client id from
# the client certificate's subject DN and refuses a CONNECT whose client_id
# disagrees with it. Combined with the Twin's `client_id == "CN=" + username`
# and `jwt.sub == username` checks, a stolen JWT replayed without the matching
# certificate fails before any authorization question is asked.
mqtt.ssl_cert_client_id_from = distinguished_name

# `mqtt.ssl_cert_login` is deliberately NOT set. Under certificate login the
# client must not supply a username and password — which is precisely the
# JWT-as-password flow this design depends on.

# internal first (AXIAM's own default user on `/` keeps working, D-26), then
# the Twin. If the running broker rejects the `http` alias, the fallback
# spelling is the module name `rabbit_auth_backend_http` (RESEARCH A3).
auth_backends.1 = internal
auth_backends.2 = http

# POST, not GET: T-01-04 — keeps the JWT out of the request URL and therefore
# out of RabbitMQ's own debug logs.
auth_http.http_method = post
auth_http.user_path     = https://device-twin:8443/rmq/user
auth_http.vhost_path    = https://device-twin:8443/rmq/vhost
auth_http.resource_path = https://device-twin:8443/rmq/resource
auth_http.topic_path    = https://device-twin:8443/rmq/topic
auth_http.request_timeout = 5000

# The broker verifies the Twin against the same organization root.
auth_http.ssl_options.cacertfile = /etc/rabbitmq/tls/root.pem
auth_http.ssl_options.verify = verify_peer
