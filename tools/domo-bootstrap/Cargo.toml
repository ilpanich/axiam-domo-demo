[package]
name = "domo-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# A library target as well as a binary: the pure parts (`naming`, `catalog`)
# are unit-testable without a server, and an integration test under `tests/`
# cannot import from a binary crate.
[lib]
name = "domo_bootstrap"
path = "src/lib.rs"

[[bin]]
name = "domo-bootstrap"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
domo-common = { workspace = true }
axiam-sdk = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }
